<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="MARVEL ONLINE 2.0">
    <meta name="author" content="furtibu">
    <title>MARVEL ONLINE 2.1</title>

    <!-- Bootstrap CSS (CDN tartalékkal, ha a helyi fájl nem töltődne be) -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"> -->

    <style>
        #minput, #accordion2, #badeners, #handlingerrors, #downloadsec, #energies, #transitions, #result {
            display: none;
        }
        .dontshow {
            display: none;
        }
        .sortable {
            cursor: pointer;
            user-select: none;
        }
        .sortable:hover {
            background-color: #e9ecef;
        }
    </style>
</head>
<body class="bg-light p-4">

    <div class="container-fluid">
        <h1 class="mb-4">MARVEL 2.1</h1>

        <div class="row g-5">
            
            <!-- Inputs Doboz -->
            <div class="col-md-4">
                <div class="card border-primary shadow-sm">
                    
                    <!-- Fejléc: Inputs bal oldalon, Reload page gomb teljesen a jobb oldalon -->
                   
                    <div class="panel-heading" style="display: flex; justify-content: space-between; align-items: center; background-color: #337ab7; color: white; border-color: #337ab7; margin-top: 25px; margin-bottom: 25px;">
						<span style="font-weight: bold;">Inputs</span>
						<button type="button" class="btn btn-xs btn-default" onclick="window.location.reload();" style="color: #333; font-weight: normal; background-color: #fff; border-color: #ccc;">
							Reload page
						</button>
					</div>
					
					
                    <div class="card-body p-3">
                        
                        <!-- NQN Mező -->
                        <div class="mb-4 d-flex align-items-center gap-2">
                            <label for="quantum" class="form-label mb-0 fw-bold">NQN:</label>
                            <input type="number" class="form-control" id="quantum" value="6" style="width: 70px; margin-bottom: 25px;">
                        </div>

                        <!-- Fájlválasztók megfelelő térközökkel (my-3 / mb-3) -->
                        <div class="my-4">
                            <div class="mb-3">
                                <label class="form-label fw-bold d-block mb-2">Select your MARVEL energy file:</label>
                                <input type="file" class="form-control ener" accept="text/plain" style="margin-bottom: 25px;">
                            </div>

                            <div class="mb-3" id="file-container">
                                <label class="form-label fw-bold d-block mb-2">Select your MARVEL transitions file:</label>
                                <input type="file" name="trans[]" class="form-control multifile" accept="text/plain" style="margin-bottom: 25px;">
                            </div>
                        </div>

                        <!-- Indító gomb -->
                        <div class="mt-4 pt-2 d-flex justify-content-end">
                            <button type="button" id="runCD" class="btn btn-success btn-lg fw-bold" style="margin-left: 105px; margin-bottom: 25px;">Run CD Test</button>
                        </div>

                        <span id="readI"></span>
                        <span id="energies"></span>
                        <span id="transitions"></span>
                    </div>
                </div>
            </div>

            <!-- Download Panel -->
            <div class="col-md-8 dontshow">
                <div class="mb-4">
					<h3 class="h4 fw-bold text-dark mb-2" id="restext">Download new transitions</h3>
					<div id="downfile"></div>
				</div>
            </div>

            <!-- Results Panel -->
            <div class="col-md-8 dontshow">
                <div class="mt-4">
				<h3 class="h4 fw-bold text-dark mb-3">Results:</h3>
					<div class="card-body">
                        <div id="result" class="table-responsive"></div>
                    </div>
                </div>
            </div>

            <!-- Details Panel -->
            <div class="col-md-8 dontshow">
                <div class="card shadow-sm">
                    <div class="card-header bg-secondary text-white">
                        <h4 class="card-title mb-0">Details:</h4>
                    </div>
                    <div class="card-body">
                        <div id="detail"></div>
                    </div>
                </div>
            </div>

        </div><!-- /row -->

    </div><!-- /container -->

    <!-- JS Fájlok (CDN hivatkozással is kiegészítve) -->
    <script src="js/jquery-3.7.1.min.js"></script>
    <!-- <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script> -->
    <script src="js/bootstrap.bundle.min.js"></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script> -->

    <script>
        var enersMap = new Map();
        var upperEnerMap = new Map();
        var transMap = new Map();
        var nbtranfile = 0;
        var fileindex = 0;
        var nqn = 0;
        var nbzerolines = 0;
        var filenames = [];

        function isNumeric(n) {
          return !isNaN(parseFloat(n)) && isFinite(n);
        }

        function transition(freq, unc, upper, lower, ref, comment, filename) {
            this.freq = freq;
            this.unc = unc;
            this.upper = upper;
            this.lower = lower;
            this.ref = ref;
            this.comment = comment;
            this.filename = filename;
        }

        function upperState(){
            this.trans = [];
            this.unc = [];
            this.lowerstates = [];
            this.lowerEners = [];
            this.refs = [];
            this.avg = 0.0;
            this.sd = 0.0;
            this.predEners = [];
            this.nbWO = 0;
            
            this.addLine = function(freq, unc, lower, lowerE, ref) {
                this.trans.push(freq);
                this.unc.push(unc);
                this.lowerstates.push(lower);
                this.lowerEners.push(lowerE);
                this.refs.push(ref);
            }
            
            this.calcAvg = function() {
                this.avg = 0.0;
                var sumwi = 0.0;
                var sumwixi = 0.0;
                
                if(this.trans.length > 1) {
                    for(var i = 0; i < this.trans.length; i++) {
                        var predEners = this.trans[i] + this.lowerEners[i];
                        this.predEners.push(predEners);
                        sumwixi += (predEners * (1.0/this.unc[i]));
                        sumwi += (1.0/this.unc[i]);
                    }
                    this.avg = sumwixi / sumwi;
                } else {
                    this.avg = this.trans[0];
                    this.predEners.push(this.trans[0]);
                }
            }
            
            this.calcStDev = function() {
                this.sd = 0.0;
                var nosqrt = 0.0;
                if(this.trans.length > 1) {
                    for(var i = 0; i < this.trans.length; i++) {
                        this.sd += ((this.predEners[i] - this.avg)*(this.predEners[i] - this.avg));
                    }
                    nosqrt = this.sd/(this.trans.length - 1);
                    this.sd = Math.sqrt(nosqrt);
                    
                    for(var i = 0; i < this.trans.length; i++) {
                        if(Math.abs((this.predEners[i] - this.avg)) > 3.0*this.sd)
                            this.nbWO++;
                    }
                }
            }
        }

        $(document).on('click','#delline',function(){
            var acttran = transMap.get($(this).attr("data"));
            if(acttran.freq > 0.0)
                acttran.freq *= -1.0;
            $(this).remove();
        });

        function download(filename, text) {
            var element = document.createElement('a');
            element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(text));
            element.setAttribute('download', filename);
            element.style.display = 'none';
            document.body.appendChild(element);
            element.click();
            document.body.removeChild(element);
        }

        $(document).on('click','.downonetrans',function(){
            var fname = $(this).attr("filename");
            var noext = fname.split('.').slice(0, -1).join('.');
            var text = "";
            
            for (var [key, value] of transMap.entries()) {
                if(fname == value.filename)
                    text+= value.freq+" "+value.unc+" "+value.upper+" "+value.lower+" "+value.ref+" "+value.comment+"\n";
            }
            
            var d = new Date();
            var filename = noext+"_"+d.getDate() + "_" + (d.getMonth()+1) + "_" + d.getFullYear() + "_" +d.getHours() + "_" + d.getMinutes()+".txt";
            download(filename, text);
        });

        $(document).on('click','#downtrans',function(){
            var text = "";
            var upplabels, lowlabels;
            for (var [key, value] of transMap.entries()) {
                upplabels = value.upper.replace("&apos;","'");
                lowlabels = value.lower.replace("&apos;","'");
                text+= value.freq+" "+value.unc+" "+upplabels+" "+lowlabels+" "+value.ref+" "+value.comment+"\n";
            }
            
            var d = new Date();
            var filename = "transitions_"+d.getDate() + "_" + (d.getMonth()+1) + "_" + d.getFullYear() + "_" +d.getHours() + "_" + d.getMinutes()+".txt";
            download(filename, text);
        });

        $(document).on('click','#showdet',function(){
            var label = $(this).attr("data").replace(/'/g,"&apos;");
            var actener = upperEnerMap.get(label);
            var dettext ="";
            var diff = 0.0;
            
            dettext = "<h5>"+$(this).attr("data")+"</h5>";
            dettext += "<strong>AVG. Energy: "+actener.avg.toFixed(6)+"</strong><br/>";
            dettext +="<table class='table table-hover mt-2'>";
            dettext +=" <thead><tr><th>pred Eners</th><th>Diff from avg</th><th>Line</th><th>Delete</th></tr></thead><tbody>";
            for(var i = 0; i < actener.trans.length; i++) {
                diff = actener.predEners[i] - actener.avg;
                dettext +="<tr><td>"+actener.predEners[i].toFixed(6)+"</td><td>"+diff.toFixed(6)+"</td><td>"+actener.refs[i]+"</td><td><button type='button' data='"+actener.refs[i]+"' id='delline' class='btn btn-danger btn-sm'>Delete</button></td></tr>";
            }
            dettext +="</tbody></table>";
            $("#detail").html(dettext);
        });

        $(document).on('click','#done',function(){
            $(this).parent().parent().remove();
        });

        function ReaderEnerFile(file) {
            var reader = new FileReader(); 
            reader.readAsText(file);
            reader.onload = function() {  
                var file_str = reader.result;
                var enerArr = file_str.split("\n");
                var labelsArr;
                var labels = "";
                
                for(var i = 0; i < enerArr.length; i++) {
                    enerArr[i] = enerArr[i].trim();
                    if(!enerArr[i]) continue;
                    labelsArr = enerArr[i].split(/\s+/g);
                    labels = "";
                    
                    for(var j = 0; j < nqn; j++) {
                        labels += labelsArr[j]+" ";
                    }
                    enersMap.set(labels, parseFloat(labelsArr[nqn])); 
                }
            }
        }

        function ReaderTranFile(file, callback) {
            var name = file.name;
            filenames.push(name);
            var reader = new FileReader(); 
            reader.readAsText(file);
            reader.onload = function() {  
                var file_str = reader.result;
                var tranArr = file_str.split("\n");
                var upplabels = "";
                var lowlabels = "";
                var freq = 0.0;
                var unc = 0.0;
                var ref = "";
                var lowerEnerValue = 0.0;
                var comment = "";
                nbzerolines = 0;
                var wronglinetext = "";
                
                for(var i = 0; i < tranArr.length; i++) {
                    tranArr[i] = tranArr[i].trim();
                    if(!tranArr[i]) continue;
                    var labelsArr = tranArr[i].split(/\s+/g);
                    
                    freq = parseFloat(labelsArr[0]);
                    if(isNumeric(freq) == false) continue;
                    
                    unc = parseFloat(labelsArr[1]);
                    
                    upplabels = "";
                    for(var j = 0; j < nqn; j++) {
                        upplabels += labelsArr[2+j]+" ";
                    }
                    upplabels = upplabels.replace(/'/g,"&apos;");
                    
                    lowlabels = "";
                    for(var j = 0; j < nqn; j++) {
                        lowlabels += labelsArr[nqn+2+j]+" ";
                    }
                    lowlabels = lowlabels.replace(/'/g,"&apos;");
                
                    ref = labelsArr[2*nqn+2];
                    
                    if(unc == 0.0 || unc < 0.0) {
                        wronglinetext +="Wrong uncertainty in line "+ref+" in file: "+name+"<br/>";
                        nbzerolines=1;
                    }
                    comment = "";
                    if(labelsArr.length > (2*nqn+3)) {
                        for(var j = 2*nqn+3; j < labelsArr.length; j++)
                            comment += labelsArr[j]+" ";
                    }
                    
                    var tr = new transition(freq, unc, upplabels, lowlabels, ref, comment, name);
                    transMap.set(ref, tr);
                    
                    if(freq > 0.0) {
                        if(upperEnerMap.has(upplabels)) {
                            if(enersMap.has(lowlabels)) {
                                lowerEnerValue = enersMap.get(lowlabels);
                                upperEnerMap.get(upplabels).addLine(freq, unc, lowlabels, lowerEnerValue, ref);
                            }
                        } else {
                            if(enersMap.has(lowlabels)) {
                                lowerEnerValue = enersMap.get(lowlabels);
                                var upstate = new upperState();
                                upstate.addLine(freq, unc, lowlabels, lowerEnerValue, ref);
                                upperEnerMap.set(upplabels, upstate);
                            }
                        }
                    }
                }
                
                fileindex++;
                
                if(nbzerolines == 0) callback();
                if(nbzerolines == 1) {
                    $("#runCD").after("<div class='alert alert-danger mt-3' role='alert'>WARNING! "+wronglinetext+" Please fix the problem(s), reload the page and try again.</div>");
                }
            }    
        }

        function checkfiles() {
            if(fileindex < nbtranfile) {
                ReaderTranFile($( ".multifile:eq("+fileindex+")" )[0].files[0], checkfiles);
            } else {
                $("#result").html("");
                
                var table=" <table id='example' class='table table-striped table-hover mt-2' style='width: 100%;'>";
                table +="<thead> <tr> <th class='sortable'>Labels ↕</th><th class='sortable'>Avg. Energy ↕</th><th class='sortable'>St. Dev. ↕</th><th class='sortable'>NbTr ↕</th><th>Details</th><th>Done</th></tr></thead>";
                table +="<tbody>";
                
                for (var [key, value] of upperEnerMap) {
                    value.calcAvg();
                    value.calcStDev();
                    table+="<tr><td>"+key+"</td><td>"+value.avg.toFixed(6)+"</td><td>"+value.sd.toFixed(6)+"</td><td>"+value.trans.length+"</td><td><button type='button' data='"+key+"' id='showdet' class='btn btn-primary btn-sm'>Details</button></td><td><button type='button' id='done' class='btn btn-success btn-sm'>Done</button></td></tr>";
                }
                table +="</tbody></table>";
                
                $("#result").append(table);
                $("#result").show();
                
                $("#downfile").html("");
                
                if(filenames.length > 1) {
                    var atext="<h5 class='h6 mb-2'>Download transitions files one by one:</h5>";
                    for(var i = 0; i < filenames.length; i++) {
                        atext += "<p class='mb-2'><button type='button' filename='"+filenames[i]+"' class='btn btn-info btn-sm text-white downonetrans'>"+filenames[i]+"</button></p>";
                    }
                    $("#downfile").append(atext);
                }
                $("#downfile").append("<h5 class='h6 mb-2 mt-3'>Download all transitions in one file:</h5><button type='button' id='downtrans' class='btn btn-info text-white'>Download Transitions</button>");
                $(".dontshow").show();
            }
        }

        $("#runCD").click(function() {
            nqn = parseInt($( "#quantum" ).val());
            
            $(".ener").each(function(index) {
                if($(this)[0].files[0]) {
                    ReaderEnerFile($(this)[0].files[0]);
                }
            });
            
            nbtranfile = $(".multifile").length;
            
            if($(".multifile:eq(0)")[0].files[0]) {
                ReaderTranFile($(".multifile:eq(0)")[0].files[0], checkfiles);
            }
        });

        /* Rendezési logika */
        $(document).on('click', '#example th.sortable', function() {
            var table = $(this).parents('table').eq(0);
            var rows = table.find('tr:gt(0)').toArray().sort(comparer($(this).index()));
            this.asc = !this.asc;
            if (!this.asc) { rows = rows.reverse(); }
            for (var i = 0; i < rows.length; i++) { table.append(rows[i]); }
        });

        function comparer(index) {
            return function(a, b) {
                var valA = getCellValue(a, index), valB = getCellValue(b, index);
                return $.isNumeric(valA) && $.isNumeric(valB) ? valA - valB : valA.toString().localeCompare(valB);
            }
        }

        function getCellValue(row, index) {
            return $(row).children('td').eq(index).text();
        }
    </script>
</body>
</html>
